################
### MONITORS ###
################

monitor = HDMI-A-1, 3840x2160, 1920x1080, 1
monitor = HDMI-A-2, 1920x1080, 0x0, 1

###################
### MY PROGRAMS ###
###################

$terminal = alacritty
$menu = wofi --show drun

#################
### AUTOSTART ###
#################

exec-once = emacs --daemon
exec-once = swaync & waybar & hyprpaper
exec-once = sleep 4; /home/ebrasca/.guix-home/profile/libexec/xdg-desktop-portal; sleep 4; /home/ebrasca/.guix-home/profile/libexec/xdg-desktop-portal-hyprland;

#############################
### ENVIRONMENT VARIABLES ###
#############################

# TODO
# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

###################
### PERMISSIONS ###
###################

# TODO
# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

#####################
### LOOK AND FEEL ###
#####################

general {
  gaps_in = 0
  gaps_out = 0
  border_size = 0
  resize_on_border = false
  allow_tearing = false
  layout = dwindle
}

decoration {
  rounding = 0
  rounding_power = 0
  active_opacity = 1.0
  inactive_opacity = 1.0
  shadow {
    enabled = false
  }
  blur {
    enabled = false
  }
}

animations {
  enabled = false
}

dwindle {
  pseudotile = true
  preserve_split = true
}

master {
  new_status = master
}

misc {
  disable_hyprland_logo = true
}

#############
### INPUT ###
#############

input {
  kb_layout  = us,es
  kb_variant = dvp,
  kb_options = grp:menu_toggle
}

device {
  name = wacom-intuos-m-pen
  output = HDMI-A-1
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, return, exec, $terminal
bind = $mainMod, K, killactive,
bind = $mainMod, C, exit,
bind = $mainMod, X, exec, $menu
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod+SHIFT, left, movewindow, l
bind = $mainMod+SHIFT, right, movewindow, r
bind = $mainMod+SHIFT, up, movewindow, u
bind = $mainMod+SHIFT, down, movewindow, d

# Switch workspaces
bind = CONTROL, F1, workspace, 1
bind = CONTROL, F2, workspace, 2
bind = CONTROL, F3, workspace, 3
bind = CONTROL, F4, workspace, 4
bind = CONTROL, F5, workspace, 5
bind = CONTROL, F6, workspace, 6
bind = CONTROL, F7, workspace, 7
bind = CONTROL, F8, workspace, 8
bind = CONTROL, F9, workspace, 9
bind = CONTROL, F10, workspace, 10
bind = CONTROL, F11, workspace, 11
bind = CONTROL, F12, workspace, 12

# Move window to a workspace
bind = ALT, F1, movetoworkspace, 1
bind = ALT, F2, movetoworkspace, 2
bind = ALT, F3, movetoworkspace, 3
bind = ALT, F4, movetoworkspace, 4
bind = ALT, F5, movetoworkspace, 5
bind = ALT, F6, movetoworkspace, 6
bind = ALT, F7, movetoworkspace, 7
bind = ALT, F8, movetoworkspace, 8
bind = ALT, F9, movetoworkspace, 9
bind = ALT, F10, movetoworkspace, 10
bind = ALT, F11, movetoworkspace, 11
bind = ALT, F12, movetoworkspace, 12

# TODO
# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# TODO
# Laptop multimedia keys for volume and LCD brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# TODO
# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Make the current focus fullscreen
bind = $mainMod+SHIFT, F11, fullscreen

# Screenshot a monitor
bind = , Print, exec, grim -g "$(slurp -or)"
# Screenshot a window
# TODO:  bindsym $mod+Print exec sway-screenshot -m window
# Screenshot a region
bind = $mainMod, Shift+Print, exec, grim -g "$(slurp -d)"

bind = $mainMod+Shift, N, exec, swaync-client -t -sw

# Resize windows
bind = ALT, R, submap, resize
submap = resize
  binde = , right, resizeactive, 10 0
  binde = , left, resizeactive, -10 0
  binde = , up, resizeactive, 0 -10
  binde = , down, resizeactive, 0 10
  bind = , escape, submap, reset
submap = reset

# Passthrough keybindings
bind = $mainMod, Pause, submap, passthrough
submap = passthrough
  bind = $mainMod, Pause, submap, reset
submap = reset

